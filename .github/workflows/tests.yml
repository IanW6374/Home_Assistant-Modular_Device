name: tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python tools/check_repository_hygiene.py
      - run: python tools/check_documentation.py
      - run: python tools/validate_json_schemas.py
      - run: python tools/check_accessibility.py
      - run: python tools/check_architecture.py
      - run: python tools/check_micropython_compat.py
      - run: python -m unittest discover -s tests -v
      - name: Compile host-only Python
        run: python -m py_compile tools/*.py tests/*.py
      - uses: actions/checkout@v5
        with:
          repository: micropython/micropython
          ref: v1.28.0
          path: .ci-micropython
      - name: Build pinned MicroPython compiler
        run: make -C .ci-micropython/mpy-cross
      - name: Compile MicroPython runtime
        shell: bash
        run: |
          set -e
          MPY_CROSS="$PWD/.ci-micropython/mpy-cross/build/mpy-cross"
          for file in *.py application/*.py device_modules/*.py services/*.py lib/*.py lib/primitives/*.py lib/uhcsr04/*.py; do
            "$MPY_CROSS" "$file" -o /tmp/ham-device-check.mpy
          done

  esp32-firmware-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: micropython/micropython
          ref: e0e9fbb17ed6fd06bb76e266ae554784c9c80804
          path: .ci-micropython
          submodules: recursive
          fetch-depth: 0
      - name: Create ephemeral CI signing material
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python tools/provision_update_signing.py \
            --private-key /tmp/iotmd-ci-update.key --generate
          python tools/generate_secure_boot_key.py \
            --esp-idf-root "$IDF_PATH" \
            --output /tmp/iotmd-ci-secure-boot.pem
      - name: Build complete secure ESP32-S3 firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          python tools/build_micropython_firmware.py \
            --micropython-root .ci-micropython \
            --version ci \
            --release-sequence 1 \
            --output /tmp/iotmd-ci.iotcore \
            --factory-output /tmp/iotmd-ci.factory.bin \
            --signing-key /tmp/iotmd-ci-update.key \
            --production-security \
            --secure-boot-signing-key /tmp/iotmd-ci-secure-boot.pem \
            --factory-setup-password-output /tmp/iotmd-ci.setup-password.txt
