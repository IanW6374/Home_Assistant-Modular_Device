name: HAMD Fleet Manager
version: 2.0.0-alpha.5
slug: hamd_fleet
description: Inventory, health, policy and staged update management for HAMD devices
url: https://github.com/ianwalton/Home_Assistant-Modular_Device
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:chip
panel_title: HAMD Fleet
panel_admin: true
homeassistant_api: true
map:
  - ssl:ro
options:
  poll_interval_s: 60
  request_timeout_s: 10
  event_retention: 5000
schema:
  poll_interval_s: int(10,3600)
  request_timeout_s: int(2,120)
  event_retention: int(100,50000)
